server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long cache for hashed assets (Vite emits content-hashed filenames).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: any non-asset path serves index.html so client-side
    # routing works on direct navigation / hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't log the favicon 404 (cosmetic).
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    # Some basic hardening; not exhaustive.
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
}
